name: CCFII Present container image

on:
  push:
    tags:
      - "*-ccfii.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable CCFII release tag to build or promote
        required: true
        type: string
      promote:
        description: Promote the existing immutable image to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ccfii-engineering/ccfii-present

jobs:
  build:
    if: github.event_name == 'push' || inputs.promote == false
    name: Build immutable release image
    runs-on: ubuntu-latest

    steps:
      - name: Validate immutable image tag
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
        run: |
          case "$IMAGE_TAG" in
            *-ccfii.*) ;;
            *)
              echo "image_tag must match *-ccfii.*; got: $IMAGE_TAG" >&2
              exit 1
              ;;
          esac
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ccfii-engineering/ccfii-present
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
      - name: Build and publish immutable Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_METADATA=${{ steps.meta.outputs.json }}
            ERL_FLAGS=+JPperf true

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote == true
    name: Promote immutable release image
    runs-on: ubuntu-latest

    steps:
      - name: Validate immutable image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          case "$IMAGE_TAG" in
            *-ccfii.*) ;;
            *)
              echo "image_tag must match *-ccfii.*; got: $IMAGE_TAG" >&2
              exit 1
              ;;
          esac
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image and promote its digest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          immutable_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          test -n "$immutable_digest"
          docker buildx imagetools create --tag "$IMAGE_NAME:production" "$IMAGE_NAME@$immutable_digest"
          production_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:production" --format '{{.Manifest.Digest}}')"
          test "$production_digest" = "$immutable_digest"
